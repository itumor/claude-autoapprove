name: build

# Push to main and every pull request: both selftests and a full build.
# A tag like v1.2.0: the same, then AutoApprove-<tag>.zip is published as a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hook selftest
        run: python3 hook/autoapprove.py --selftest
      - name: Build app (runs the app selftest)
        run: ./build.sh   # no signing identity on the runner: ad-hoc signature

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-latest
    permissions:
      contents: write   # to create the release; only this job, only on a tag
    steps:
      - uses: actions/checkout@v4
      - name: Hook selftest
        run: python3 hook/autoapprove.py --selftest
      - name: Build app (runs the app selftest)
        run: ./build.sh
      - name: Package
        run: |
          mkdir -p dist/AutoApprove
          ditto build/AutoApprove.app dist/AutoApprove/AutoApprove.app
          cp -R hook install.sh LICENSE README.md dist/AutoApprove/
          ditto -c -k --keepParent dist/AutoApprove "AutoApprove-$GITHUB_REF_NAME.zip"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "AutoApprove-$GITHUB_REF_NAME.zip" --generate-notes
